schema_version: 1
evaluation_split: test
seeds: [1101, 1202, 1303, 1404, 1505]
selection_seeds: [401, 402, 403]
selection_policy: >-
  The one-matrix local rule and the regularized offline reference were selected
  from the validation records in strengthening2-validation-ledger.json. All
  configurations, split roles, seeds, and readouts are fixed before this
  evaluation.

probe:
  epochs: 60
  batch_size: 2048
  optimizer: adamw
  learning_rate: 0.003
  weight_decay: 0.0001
  readout: all

datasets:
  mnist:
    data_root: ../../data/mnist
    num_classes: 10
    selected_configuration_id: terel-combined-trial-000
    runs:
      - id: terel
        encoder: &terel
          method: terel_residual
          hidden_dims: [512, 256]
          activation: relu
          normalization: none
          training_mode: joint
          augmentation: none
          gradient_accumulation_steps: 1
          epochs: 2
          batch_size: 1
          order_mode: class_chunks
          chunk_size: 16
          optimizer: plain_sgd
          learning_rate: 0.013870266872900201
          weight_decay: 0.000001
          similarity_coefficient: 1.0
          variance_coefficient: 3.001981471213246
          covariance_coefficient: 0.6061334936982908
          variance_target: 1.0
          statistics_momentum: 0.99
          lateral_momentum: 0.995
          residual_lateral_rule: dual_inhibitory
          residual_lateral_coefficient: 0.5749502865863861
          residual_lateral_steps: 1
          residual_lateral_step_size: 0.1
          residual_lateral_include_diagonal: true
          residual_lateral_moment_normalization: none
          residual_lateral_signal_offset: 0
          postsynaptic_state_mode: exact
          lateral_matrix_mode: combined
          combined_lateral_state_weight: 0.5911099660677379
          temporal_term_enabled: true
          inference_mode: paired

      - id: terel-offline
        encoder:
          method: terel_offline
          hidden_dims: [512, 256]
          activation: relu
          normalization: none
          epochs: 20
          batch_size: 128
          order_mode: class_chunks
          chunk_size: 16
          optimizer: sgd
          optimizer_momentum: 0.95
          learning_rate: 0.010943651646100146
          weight_decay: 0.000001
          similarity_coefficient: 1.0
          variance_coefficient: 2.5299242416163943
          covariance_coefficient: 0.021847119973486238
          variance_target: 0.8627892708624838

      - id: random
        encoder:
          method: random
          hidden_dims: [512, 256]
          activation: relu
          normalization: none

      - id: supervised-linear
        encoder:
          method: supervised_linear
          hidden_dims: [512, 256]

      - id: supervised-offline
        encoder:
          method: bp
          hidden_dims: [512, 256]
          activation: relu
          normalization: none
          epochs: 10
          batch_size: 256
          optimizer: adamw
          learning_rate: 0.0003
          weight_decay: 0.0001

      - id: layer-local-supcon
        encoder:
          method: local_supcon
          hidden_dims: [512, 256]
          activation: leaky_relu
          normalization: batch_norm
          epochs: 60
          batch_size: 256
          order_mode: class_chunks
          chunk_size: 16
          optimizer: adamw
          learning_rate: 0.001
          weight_decay: 0.0001
          contrastive_temperature: 0.1

      - id: batch-sfa
        encoder:
          method: sfa
          hidden_dims: [256]
          order_mode: class_chunks
          chunk_size: 16
          sfa_components: 256

      - id: incremental-sfa
        encoder:
          method: incsfa
          hidden_dims: [32]
          epochs: 1
          order_mode: class_chunks
          chunk_size: 16
          incsfa_whitening_dim: 32
          incsfa_output_dim: 32
          incsfa_learning_rate: 0.001

      - id: no-temporal
        encoder:
          <<: *terel
          temporal_term_enabled: false
          inference_mode: offline

      - id: no-variance
        encoder:
          <<: *terel
          variance_coefficient: 0.0
          inference_mode: offline

      - id: no-covariance
        encoder:
          <<: *terel
          covariance_coefficient: 0.0
          inference_mode: offline

      - id: shuffled-order
        encoder:
          <<: *terel
          order_mode: shuffled
          inference_mode: offline
