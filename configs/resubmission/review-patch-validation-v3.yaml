protocol_version: review-patch-v3.0
maximum_candidates: 8
data_root: ../../data/mnist

encoder_base:
  method: local_supcon
  hidden_dims: [512, 256]
  activation: leaky_relu
  normalization: batch_norm
  normalization_momentum: 0.9
  training_mode: joint
  augmentation: none
  gradient_accumulation_steps: 1
  epochs: 60
  batch_size: 256
  order_mode: class_chunks
  chunk_size: 16
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  similarity_coefficient: 1.0
  variance_coefficient: 2.5
  covariance_coefficient: 1.0
  variance_target: 1.0
  statistics_momentum: 0.9
  lateral_momentum: 0.0
  contrastive_temperature: 0.2
  audit_lateral_proxy: false

probe_base:
  epochs: 60
  batch_size: 2048
  optimizer: adamw
  learning_rate: 0.003
  weight_decay: 0.0001
  readout: all

candidates:
  - id: local-supcon-lr1e4-t01
    description: Local SupCon with the lower learning rate and temperature 0.1.
    encoder: {learning_rate: 0.0001, contrastive_temperature: 0.1}
  - id: local-supcon-lr1e4-t02
    description: Local SupCon with the lower learning rate and temperature 0.2.
    encoder: {learning_rate: 0.0001, contrastive_temperature: 0.2}
  - id: local-supcon-lr3e4-t01
    description: Local SupCon with the TeReL learning rate and temperature 0.1.
    encoder: {learning_rate: 0.0003, contrastive_temperature: 0.1}
  - id: local-supcon-lr3e4-t02
    description: Local SupCon with the TeReL learning rate and temperature 0.2.
    encoder: {learning_rate: 0.0003, contrastive_temperature: 0.2}
  - id: local-supcon-lr1e3-t01
    description: Local SupCon with the upper learning rate and temperature 0.1.
    encoder: {learning_rate: 0.001, contrastive_temperature: 0.1}
  - id: local-supcon-lr1e3-t02
    description: Local SupCon with the upper learning rate and temperature 0.2.
    encoder: {learning_rate: 0.001, contrastive_temperature: 0.2}
  - id: direct-covariance-matched
    description: Undetached greedy same-batch direct covariance control with gradient scale matched to the canonical proxy.
    encoder:
      method: terel_direct_batch
      training_mode: greedy
      epochs: 30
      covariance_coefficient: 0.25
  - id: lagged-proxy-audit
    description: Canonical recovered TeReL with reporting-only lagged-versus-same-batch direction diagnostics.
    encoder:
      method: terel_batch
      training_mode: greedy
      epochs: 30
      audit_lateral_proxy: true
