protocol_version: residual-state-terel-s-v1
selection_split: validation
evaluation_source: train-derived MNIST validation split
seeds: [101, 102, 103]
data_root: /home/davwis/main/data/mnist
output_root: artifacts/residual-state-validation
maximum_candidates: 2

encoder_base:
  hidden_dims: [512, 256]
  activation: leaky_relu
  normalization: none
  training_mode: joint
  augmentation: none
  gradient_accumulation_steps: 1
  epochs: 2
  batch_size: 1
  order_mode: class_chunks
  chunk_size: 16
  optimizer: adamw
  learning_rate: 0.000006
  weight_decay: 0.0
  similarity_coefficient: 1.0
  variance_coefficient: 2.5
  covariance_coefficient: 1.0
  variance_target: 1.0
  statistics_momentum: 0.99
  lateral_momentum: 0.99

probe_base:
  epochs: 60
  batch_size: 2048
  optimizer: adamw
  learning_rate: 0.003
  weight_decay: 0.0001
  readout: all

candidates:
  - id: terel-s-reference
    description: Matched two-pass identity-normalized TeReL-S reference.
    encoder:
      method: terel_local
  - id: terel-s-residual
    description: Residual-state TeReL-S with same-state inhibitory plasticity.
    encoder:
      method: terel_residual
      residual_lateral_rule: dual_inhibitory
      residual_lateral_coefficient: 1000.0
      residual_lateral_steps: 4
      residual_lateral_step_size: 0.1
      residual_lateral_include_diagonal: true
      residual_lateral_moment_normalization: features
