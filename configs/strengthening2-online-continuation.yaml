schema_version: 1
evaluation_split: test
seeds: [1101, 1202, 1303, 1404, 1505]
selection_seeds: [1101]
selection_policy: >-
  Select the largest continuation step in the validation-only scale diagnostic
  that preserves both fixed-encoder accuracy and effective rank. Freeze that
  scale before the participant-independent held-out evaluation.

probe:
  epochs: 60
  batch_size: 2048
  optimizer: adamw
  learning_rate: 0.003
  weight_decay: 0.0001
  readout: all

datasets:
  mnist:
    data_root: ../../data/mnist
    num_classes: 10
    selected_configuration_id: terel-online-scale-0.001
    runs:
      - id: terel-online-scaled
        encoder:
          method: terel_residual
          hidden_dims: [512, 256]
          activation: relu
          normalization: none
          training_mode: joint
          augmentation: none
          gradient_accumulation_steps: 1
          epochs: 2
          batch_size: 1
          order_mode: class_chunks
          chunk_size: 16
          optimizer: plain_sgd
          learning_rate: 0.013870266872900201
          weight_decay: 0.000001
          similarity_coefficient: 1.0
          variance_coefficient: 3.001981471213246
          covariance_coefficient: 0.6061334936982908
          variance_target: 1.0
          statistics_momentum: 0.99
          lateral_momentum: 0.995
          residual_lateral_rule: dual_inhibitory
          residual_lateral_coefficient: 0.5749502865863861
          residual_lateral_steps: 1
          residual_lateral_step_size: 0.1
          residual_lateral_include_diagonal: true
          residual_lateral_moment_normalization: none
          residual_lateral_signal_offset: 0
          postsynaptic_state_mode: exact
          lateral_matrix_mode: combined
          combined_lateral_state_weight: 0.5911099660677379
          temporal_term_enabled: true
          inference_mode: paired
          online_learning_rate_scale: 0.001
