protocol_version: canonical-online-learning-screen-v1
selection_split: validation
evaluation_source: train-derived MNIST validation split
seeds: [101]
data_root: /home/davwis/main/data/mnist
output_root: /home/davwis/main/workspace/terel-paper-internal/canonical-online-learning/artifacts/optimizer-screen
maximum_candidates: 10

encoder_base:
  method: terel_residual
  hidden_dims: [512, 256]
  activation: leaky_relu
  normalization: none
  training_mode: joint
  augmentation: none
  gradient_accumulation_steps: 1
  epochs: 2
  batch_size: 1
  order_mode: class_chunks
  chunk_size: 16
  optimizer: adamw
  learning_rate: 0.000006
  weight_decay: 0.0
  similarity_coefficient: 1.0
  variance_coefficient: 2.5
  covariance_coefficient: 1.0
  variance_target: 1.0
  statistics_momentum: 0.99
  lateral_momentum: 0.99
  residual_lateral_rule: dual_inhibitory
  residual_lateral_coefficient: 1000.0
  residual_lateral_steps: 4
  residual_lateral_step_size: 0.1
  residual_lateral_include_diagonal: true
  residual_lateral_moment_normalization: features

probe_base:
  epochs: 60
  batch_size: 2048
  optimizer: adamw
  learning_rate: 0.003
  weight_decay: 0.0001
  readout: all

candidates:
  - id: adamw-reference
    description: Exact residual-state validation reference.
  - id: adamw-no-first-moment
    description: Remove Adam's first-moment estimate while retaining its second moment.
    encoder:
      optimizer_beta1: 0.0
  - id: adamw-no-second-memory
    description: Remove Adam's accumulated second-moment memory while retaining momentum.
    encoder:
      optimizer_beta2: 0.0
  - id: plain-sgd-1e-4
    description: Plain samplewise SGD, lower bracket endpoint.
    encoder:
      optimizer: plain_sgd
      learning_rate: 0.0001
  - id: plain-sgd-1e-3
    description: Plain samplewise SGD, bracket center.
    encoder:
      optimizer: plain_sgd
      learning_rate: 0.001
  - id: plain-sgd-1e-2
    description: Plain samplewise SGD, upper bracket endpoint.
    encoder:
      optimizer: plain_sgd
      learning_rate: 0.01
  - id: momentum-sgd-1e-3
    description: Add only classical momentum to the center SGD rate.
    encoder:
      optimizer: sgd
      learning_rate: 0.001
      optimizer_momentum: 0.9
  - id: settling-1
    description: One same-layer residual-inhibition step instead of four.
    encoder:
      residual_lateral_steps: 1
  - id: settling-2
    description: Two same-layer residual-inhibition steps instead of four.
    encoder:
      residual_lateral_steps: 2
  - id: settling-0
    description: No residual-inhibition settling; mechanism boundary control.
    encoder:
      residual_lateral_steps: 0
